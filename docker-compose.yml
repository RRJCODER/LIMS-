services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: olive_lims
      POSTGRES_USER: lims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-limsdev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lims -d olive_lims"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://lims:${POSTGRES_PASSWORD:-limsdev}@postgres/olive_lims
      SYNC_DATABASE_URL: postgresql+psycopg2://lims:${POSTGRES_PASSWORD:-limsdev}@postgres/olive_lims
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production-use-openssl-rand-hex-32}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      MEDIA_ROOT: /app/media
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 3000
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_files:
