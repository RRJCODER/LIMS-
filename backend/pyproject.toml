[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olive-lims-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",

    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",

    # Validation
    "pydantic>=2.7",
    "pydantic-settings>=2.2",

    # Instrument communication
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",

    # Reporting
    "weasyprint>=61",
    "jinja2>=3.1",

    # Utilities
    "python-barcode[images]>=0.15",
    "pillow>=10",
    "httpx>=0.27",
    "redis>=5",
    "aiofiles>=23",

    # QC / Math
    "numpy>=1.26",
    "scipy>=1.13",

    # Email
    "fastapi-mail>=1.4",

    # Rate limiting
    "slowapi>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "faker>=25",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
